name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main and distribution credentials
        env:
          GREASYFORK_WEBHOOK_SECRET: ${{ secrets.GREASYFORK_WEBHOOK_SECRET }}
          GREASYFORK_WEBHOOK_URL: ${{ secrets.GREASYFORK_WEBHOOK_URL }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -n "$GREASYFORK_WEBHOOK_SECRET"
          test -n "$GREASYFORK_WEBHOOK_URL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - name: Publish verified assets before notifying Greasy Fork
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Synchronize Greasy Fork code and description
        run: node scripts/sync-greasyfork.mjs
        env:
          GREASYFORK_WEBHOOK_SECRET: ${{ secrets.GREASYFORK_WEBHOOK_SECRET }}
          GREASYFORK_WEBHOOK_URL: ${{ secrets.GREASYFORK_WEBHOOK_URL }}
